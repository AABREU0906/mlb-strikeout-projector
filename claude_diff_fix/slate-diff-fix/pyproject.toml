[project]
name = "mlb-strikeout-projector"
version = "0.1.0"
description = "Local MLB starting-pitcher strikeout projection system"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
